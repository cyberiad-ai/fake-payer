# The phone tree: what a caller hears and presses when the line answers as a menu. Everything here is made up, like the rest of the line.
#
# Node types:
#   say       says `say`, then goes to `next`.
#   menu      says `say`, then waits for a key; `options` maps a key (0-9, *, #) to the next node. A key that is not listed, or no key in `entry_timeout_seconds`, is a
#             failure ("invalid" / "timeout" lines are said and the menu starts again); after `max_failures` the line goes to `giveup`.
#   collect   says `say`, then collects `length` digits into `field` (a key press during the prompt counts). `*` goes to `star_to` if there is one. `check: date` wants
#             MMDDYYYY and says `invalid` if it is not a real date. Goes to `next`.
#   form      reads out the practice's verification-form questions of one fixture `topic`, seven to a page; a question's key says its answer, 9 turns the page, * goes to
#             `back`. The topics are the fixture's (`benefit_answers`); the tree and the fixture must agree on them (PhoneTree.check_against).
#   action    does what `action` names (see ACTIONS in tree.py), says what it returns, then goes to the node `routes` gives for its outcome.
#   hold      plays hold music for `seconds` (the caller's keys are ignored), then goes to `next`.
#   transfer  says `say`, then hands the call to the representative (the conversational line).
#   hangup    says `say` (if any), then hangs up.
# Text may not contain braces. Keys are quoted so YAML keeps them as text.
#
# The dead ends and bad paths are on purpose, so an automated caller can be tested against them: claim status says it cannot help and hangs up; the fax option goes round to
# the main menu; provider enrollment is a loop with no way forward; a supervisor never comes; a wrong date of birth is refused (three tries, then the call ends).

settings:
  entry_timeout_seconds: 12
  max_failures: 3
  hold_seconds: 8
  giveup: no_entry                     # where a menu or entry goes after max_failures failures in a row (a node may name its own `giveup`)

start: greeting

nodes:
  greeting:
    type: say
    say: >-
      Thank you for calling Acme Dental Benefits, provider services. This is a fictional insurance line used for testing, and this call is recorded.
      Please listen carefully, as our menu options have changed.
    next: main

  main:
    type: menu
    say: >-
      For eligibility and benefits, press 1. For claim status, press 2. For fax numbers and mailing addresses, press 3. For provider enrollment, press 4.
      To speak with a supervisor, press 5. For plan questions, press 6. For plan benefits by group number, press 7. For a reference number for this call, press 8.
      To speak with a representative, press 0. To hear these options again, press 9.
    options: {"1": eligibility_benefits, "2": claims, "3": addresses, "4": enrollment, "5": supervisor, "6": forms, "7": ask_group, "8": reference, "0": representative, "9": main}
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  no_entry:
    type: hangup
    say: We did not receive a valid entry. Goodbye.

  # ---- eligibility and benefits ------------------------------------------------------------------------------------------------------------
  # For now this goes straight to the same conversational line as "speak with a representative" (agent_framework's platform agent is not
  # expected to navigate a numbered self-service benefits menu -- it is built around a back-and-forth conversation). The member-ID/DOB
  # self-service collection flow this used to lead to (ask_member/ask_dob/verify/not_verified/cannot_verify/after_terminated) is removed
  # rather than left unreachable (the tree's own reachability check does not allow dead nodes); it is still in git history if a later
  # change adds real self-service-menu navigation to the platform agent.

  eligibility_benefits:
    type: say
    say: Please hold for the next available representative.
    next: eligibility_benefits_hold

  eligibility_benefits_hold:
    type: hold
    next: eligibility_benefits_transfer

  eligibility_benefits_transfer:
    type: transfer
    say: Thank you for holding.

  member_menu:
    type: menu
    say: >-
      For eligibility dates, press 1. For the annual maximum and deductible, press 2. For coverage percentages, press 3. For waiting periods, press 4.
      For covered services and their limits, press 5. To check a procedure code, press 6. For plan questions, press 8.
      To return to the main menu, press star. To hear these options again, press 9.
    options: {"1": eligibility, "2": maximum, "3": percentages, "4": waiting, "5": services_menu, "6": ask_code, "8": forms, "*": main, "9": member_menu}
    invalid: That is not a valid option.
    timeout: We did not receive your entry.
    giveup: no_entry

  eligibility:
    type: action
    action: say_eligibility
    routes: {done: member_menu}

  maximum:
    type: action
    action: say_maximum
    routes: {done: member_menu}

  percentages:
    type: action
    action: say_percentages
    routes: {done: member_menu}

  waiting:
    type: action
    action: say_waiting
    routes: {done: member_menu}

  services_menu:
    type: menu
    say: For preventive services, press 1. For basic services, press 2. For major services, press 3. For orthodontics, press 4. To go back, press star.
    options: {"1": services_preventive, "2": services_basic, "3": services_major, "4": services_orthodontics, "*": member_menu}
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  services_preventive:
    type: action
    action: say_services
    args: {category: preventive}
    routes: {done: services_menu}

  services_basic:
    type: action
    action: say_services
    args: {category: basic}
    routes: {done: services_menu}

  services_major:
    type: action
    action: say_services
    args: {category: major}
    routes: {done: services_menu}

  services_orthodontics:
    type: action
    action: say_services
    args: {category: orthodontics}
    routes: {done: services_menu}

  ask_code:
    type: collect
    field: code
    length: 4
    say: Please enter the four digits of the procedure code, without the letter D. To go back, press star.
    star_to: member_menu
    next: check_code
    invalid: That procedure code is not complete.

  check_code:
    type: action
    action: say_procedure
    routes: {done: member_menu}

  # ---- benefits by group number, with no member ---------------------------------------------------------------------------------------------

  ask_group:
    type: collect
    field: group
    length: 5
    say: Please enter the five digit group number, without the letter G. To return to the main menu, press star.
    star_to: main
    next: verify_group
    invalid: That group number is not complete.

  verify_group:
    type: action
    action: verify_group
    routes: {found: member_menu, unverified: group_not_found, giveup: cannot_find_group}

  group_not_found:
    type: say
    say: We could not find that group number. Let's try again.
    next: ask_group

  cannot_find_group:
    type: hangup
    say: We are unable to find that group. Please check the group number and call back. Goodbye.

  # ---- the practice's verification-form questions, by topic; no member is needed ----------------------------------------------------------------

  forms:
    type: menu
    say: >-
      For plan and network questions, press 1. For maximums, deductibles and percentages, press 2. For exams, x-rays and preventive care, press 3.
      For periodontal care, press 4. For fillings, crowns and other restorative care, press 5. For orthodontics, press 6. For history on file, press 7.
      To return to the main menu, press star.
    options: {"1": form_plan, "2": form_amounts, "3": form_preventive, "4": form_perio, "5": form_restorative, "6": form_ortho, "7": form_history, "*": main, "9": forms}
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  form_plan:
    type: form
    topic: plan
    back: forms
    say: "Plan and network questions."
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  form_amounts:
    type: form
    topic: amounts
    back: forms
    say: "Maximums, deductibles and percentages."
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  form_preventive:
    type: form
    topic: preventive
    back: forms
    say: "Exams, x-rays and preventive care."
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  form_perio:
    type: form
    topic: perio
    back: forms
    say: "Periodontal care."
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  form_restorative:
    type: form
    topic: restorative
    back: forms
    say: "Fillings, crowns and other restorative care."
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  form_ortho:
    type: form
    topic: ortho
    back: forms
    say: "Orthodontics."
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  form_history:
    type: form
    topic: history
    back: forms
    say: "History on file."
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  reference:
    type: action
    action: say_reference
    routes: {done: main}

  # ---- dead ends and bad paths ------------------------------------------------------------------------------------------------------------

  claims:
    type: hangup
    say: Claim status is not available on this line. To check a claim, please use the provider portal. Goodbye.

  addresses:
    type: say
    say: Claims may be mailed to the address printed on the back of the member's card. Fax numbers are not available on this line.
    next: main

  enrollment:
    type: menu
    say: To enroll a new provider, press 1. To update an existing provider, press 2. To return to the main menu, press 3.
    options: {"1": enroll_new, "2": enroll_update, "3": main}
    invalid: That is not a valid option.
    timeout: We did not receive your entry.

  enroll_new:
    type: say
    say: New provider enrollment is handled by our credentialing department, which is closed. Please call back during business hours.
    next: enrollment

  enroll_update:
    type: say
    say: To update an existing provider, the provider must first be enrolled as a new provider.
    next: enrollment

  supervisor:
    type: say
    say: Please hold for the next available supervisor.
    next: supervisor_hold

  supervisor_hold:
    type: hold
    next: supervisor_gone

  supervisor_gone:
    type: hangup
    say: All of our supervisors are busy. Please try your call again later. Goodbye.

  representative:
    type: say
    say: Please hold for the next available representative.
    next: representative_hold

  representative_hold:
    type: hold
    next: representative_transfer

  representative_transfer:
    type: transfer
    say: Thank you for holding.
